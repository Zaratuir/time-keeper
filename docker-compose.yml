services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_PATH: /data/timekeeper.db
    volumes:
      - timekeeper-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  timekeeper-data:
